# Monorepo: deploy the Spring API only.
# In Railway → Service Settings → Root Directory, set: backend
# Builder: Dockerfile (or leave as configured below).
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
