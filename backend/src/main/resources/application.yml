server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/eleven;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never
app:
  auth:
    issuer: ${AUTH_ISSUER:}
    audience: ${AUTH_AUDIENCE:eleven-eleven-api}
